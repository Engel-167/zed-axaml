id = "axaml"
name = "AXAML"
description = "AXAML support for Avalonia® projects: syntax highlighting, plus diagnostics, completion, hover and navigation through the axaml-ls language server."
version = "0.1.0"
schema_version = 1
authors = ["Engel-167"]
repository = "https://github.com/Engel-167/zed-axaml"

[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
rev = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "xml"

[language_servers.axaml-ls]
name = "AXAML Language Server"
languages = ["AXAML"]

[language_servers.axaml-ls.language_ids]
AXAML = "axaml"
